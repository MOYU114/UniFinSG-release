name: UniFinSG checks and deployment
on:
  pull_request:
  push:
    branches: ['*_dev', feat_test, main]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.2-bookworm
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Create exclusive integration test schemas
        env:
          MYSQL_PWD: ci-only-password
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          for suite in MIGRATIONS TESTDB FINANCE REGRESSION COGNITO ME EVAL TRANSACTIONS SNAPSHOT AGENTV2 DRAFTS; do
            database="unifinsg_test_${suite,,}"
            docker exec -e MYSQL_PWD "$MYSQL_CONTAINER" mysql -uroot -e "CREATE DATABASE ${database};"
            echo "TEST_MYSQL_${suite}_DSN=root:ci-only-password@tcp(127.0.0.1:3306)/${database}?parseTime=true" >> "$GITHUB_ENV"
          done
        # The service ID is supplied by GitHub, not a name guessed from docker ps.
        shell: bash
      - name: Go tests (serialized packages isolate shared Redis fixtures)
        working-directory: backend
        env:
          CGO_ENABLED: '1'
          TEST_REDIS_ADDR: 127.0.0.1:6379
          TEST_REDIS_DB: '15'
          TEST_REDIS_EVAL_ADDR: 127.0.0.1:6379
        run: go test -p 1 ./...
      - name: govulncheck (advisory until existing findings are fixed)
        working-directory: backend
        continue-on-error: true
        env:
          CGO_ENABLED: '1'
          # Use the Go version installed from go.mod; never let `go run
          # pkg@version` switch to a newer toolchain that bytedance/sonic
          # (via Gin) cannot build with.
          GOTOOLCHAIN: local
        # Pinned to the newest x/vuln that builds with the module's Go 1.25
        # toolchain: v1.8+ requires Go 1.26 and bytedance/sonic (via Gin) does
        # not compile there yet. Remove the pin once that dependency is updated.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build deployment image
        run: docker build -t unifinsg-ci:${{ github.sha }} backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref_name == 'feat_test' || github.ref_name == 'main') && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Release
        env:
          EXPECTED_ACCOUNT_ID: '815194656290'
          AWS_REGION: ap-southeast-1
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          RELEASE_ID: ${{ github.sha }}
        run: bash deploy/release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ github.sha }}
          path: deploy/output/
